version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: mkprinting_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 17210535Rohan
      POSTGRES_DB: mkprinting
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mkprinting_redis
    ports:
      - '6379:6379'
    restart: unless-stopped

volumes:
  postgres_data:
