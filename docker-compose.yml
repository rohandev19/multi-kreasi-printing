version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: mkprinting_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: mkprinting
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:1.20.0
    container_name: mkprinting_pgbouncer
    environment:
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/mkprinting
      - MAX_CLIENT_CONN=500
      - DEFAULT_POOL_SIZE=20
      - POOL_MODE=transaction
    ports:
      - '6432:6432'
    depends_on:
      - postgres
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mkprinting_redis
    ports:
      - '6379:6379'
    restart: unless-stopped

volumes:
  postgres_data:
