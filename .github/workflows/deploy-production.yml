name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Pindah ke direktori Production di VPS
            cd /var/www/multikreasiprinting-production
            
            # Tarik kode terbaru dari GitHub branch main
            git pull origin main
            
            # Update & Build Backend
            cd backend
            npm install
            npm run build
            
            # Restart backend server di PM2
            pm2 restart mkp-backend-prod
            
            # Kembali ke folder frontend & Build
            cd ../frontend
            npm install
            npm run build
            
            echo "✅ Deployment ke Production selesai!"
