name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install K6
        run: |
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run K6 Load Test
        run: k6 run k6-load-test.js
        env:
          K6_API_URL: ${{ secrets.STAGING_API_URL }}
          
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Jika menggunakan password, buka komentar di bawah ini:
          # password: ${{ secrets.VPS_PASSWORD }}
          script: |
            # Pindah ke direktori Staging di VPS (Sesuaikan path ini dengan folder di server Anda)
            cd /var/www/multikreasiprinting-staging
            
            # Tarik kode terbaru dari GitHub branch staging
            git pull origin staging
            
            # Update & Build Backend
            cd backend
            npm install
            npm run build
            
            # Restart backend server di PM2 (Sesuaikan nama aplikasi PM2)
            pm2 restart mkp-backend-staging
            
            # Kembali ke folder frontend & Build
            cd ../frontend
            npm install
            npm run build
            
            echo "✅ Deployment ke Staging selesai!"
